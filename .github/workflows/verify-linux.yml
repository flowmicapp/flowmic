# The node-side gate on Linux — the relay's own platform.
#
# WHY THIS EXISTS: production serves server-core's dist on a Linux VPS, yet
# every server/protocol/golden suite in this repo has only ever run on
# Windows (verify.yml) or a dev machine. This job runs the node-side stages
# on the platform the relay actually ships to.
#
# WHAT IS DELIBERATELY ABSENT: the Rust family (sidecar bundle, clippy,
# rust-tests, doctests). There is no Linux desktop build — tauri.conf ships
# Windows bundles, the Rust tree has no Linux injection backend, and
# pretending to verify one would be a green about nothing. The day a Linux
# desktop build exists, those stages get added here the same way everything
# else was: observed green first.
#
# Promoted to `push` / `pull_request` on 2026-08-15 under the same contract
# flutter.yml satisfied: observed green (run 31851656414, the third
# dispatch), wall-clock sane (2m37s against the 30-minute timeout), and this
# commit links the run. The first dispatch measured, rather than assumed,
# which stages belong here — see the note above the absent script-tests
# stage and the pin-aware skip in sidecar-excludes-stt-cloud.test.ts.

name: verify-linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: the node-side gate on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Full history for the same reason as verify.yml: verify:scripts contains
      # guards that read specific historical commits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build protocol
        run: pnpm --filter @flowmic/protocol build

      - name: Lint
        run: pnpm verify:lint

      - name: Types
        run: pnpm verify:types

      # Script tests are DELIBERATELY absent, measured not assumed (first
      # dispatch, 2026-08-15): build1-sidecar-preflight asserts the staged
      # sidecar tree (server.js / node_modules — build artifacts this job
      # never builds), and it27-publish-node-pin demands a linux-x64 entry in
      # scripts/vendor/bundled-node.mjs — there is no Linux desktop, so no
      # Linux node pin exists BY DESIGN. Those suites run on the Windows and
      # macOS gates, where the thing they measure exists.

      - name: Golden
        run: pnpm golden

      - name: Protocol tests
        run: pnpm verify:protocol-tests

      - name: Server tests
        run: pnpm verify:server-tests

      - name: Desktop tests
        run: pnpm verify:desktop-tests

      - name: Desktop typecheck
        run: pnpm verify:types:desktop
