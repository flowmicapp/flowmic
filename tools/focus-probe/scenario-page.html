<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>FLOWMICPROBE PHASE:boot</title>
<!--
  SPEC-REF: docs/strategy/2026-08-02-f1b-universal-focus-probe-matrix.md
  🔴 NOT PRODUCT. Spike instrument for the F1b focus-judgement survey.

  WHY THE PAGE NAMES ITS OWN PHASE IN THE TITLE
    The probe is a separate process with no way to know what is focused inside the
    renderer. If it bucketed samples by wall-clock ("seconds 0-9 must have been the
    input phase") the matrix would be measuring MY TIMING ASSUMPTION, not the app.
    So the page writes the truth it alone knows — which element it just focused —
    into document.title, and the probe reads it back off the window title with
    GetWindowTextW. Every sample is labelled by the target itself.

  FOUR SCENARIOS (the ones a judgement has to get right, per the F1b card):
    none      ① nothing focused          — blur(), body is not focusable
    input     ② focus in a real text box — <input type=text>
    button    ③ focus in the same app, not a text box — <button>
    readonly  ④ focus in a read-only text area — <textarea readonly>
  Each phase dwells 9s — longer than the 8s in which Win11 Notepad was measured to
  contradict itself (2026-07-30), so a slow flip has room to show up.
-->
<style>
  html,body{margin:0;height:100%;font:16px/1.5 system-ui,sans-serif;background:#101418;color:#e8eef5}
  main{display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center;height:100%}
  #phase{font-size:64px;font-weight:700;letter-spacing:2px}
  #hint{opacity:.7}
  input,textarea,button{font:20px system-ui;padding:10px 14px;width:520px;box-sizing:border-box}
  textarea{height:90px}
  #inert{width:520px;padding:14px;border:1px dashed #445;color:#8aa}
</style>
</head>
<body>
<main>
  <div id="phase">boot</div>
  <div id="hint">FlowMic F1b focus probe — 请勿输入，页面会自己切换焦点</div>
  <input id="txt" type="text" placeholder="① 真实输入框 (text input)">
  <button id="btn" type="button">② 同一个 app 的非输入框 (button)</button>
  <textarea id="ro" readonly>③ 只读文本区 (readonly textarea)</textarea>
  <div id="inert">④ 什么都没聚焦时页面上的惰性区域（不可聚焦）</div>
  <div id="clock"></div>
</main>
<script>
(function () {
  var PHASES = ['none', 'input', 'button', 'readonly'];
  var DWELL_MS = 9000;
  var ROUNDS = 2;
  var i = 0, total = PHASES.length * ROUNDS;

  function apply(name) {
    // Set the title FIRST: a sample taken during the focus change must never be
    // labelled with the phase it is leaving.
    document.title = 'FLOWMICPROBE PHASE:' + name;
    document.getElementById('phase').textContent = name;
    if (name === 'none') {
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      // Belt and braces: some engines keep the last field 「active」 after blur().
      if (document.body.setActive) { try { document.body.setActive(); } catch (e) {} }
    } else if (name === 'input') {
      document.getElementById('txt').focus();
    } else if (name === 'button') {
      document.getElementById('btn').focus();
    } else if (name === 'readonly') {
      document.getElementById('ro').focus();
    }
  }

  function step() {
    if (i >= total) {
      document.title = 'FLOWMICPROBE PHASE:done';
      document.getElementById('phase').textContent = 'done';
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      return;
    }
    apply(PHASES[i % PHASES.length]);
    i++;
    setTimeout(step, DWELL_MS);
  }

  var t0 = Date.now();
  setInterval(function () {
    document.getElementById('clock').textContent =
      ((Date.now() - t0) / 1000).toFixed(0) + 's / ' + (total * DWELL_MS / 1000) + 's';
  }, 250);

  // 🔴 Do not start until the window actually HAS focus. A .focus() call inside a
  // background window sets the DOM's active element without producing any OS-level
  // caret, so a run that starts before activation would silently measure the wrong
  // thing for its whole first round.
  document.title = 'FLOWMICPROBE PHASE:waiting';
  var waited = 0;
  (function waitForFocus() {
    // 🔴 Fallback after 3s: this machine's session can have NO foreground window at
    // all (measured 2026-08-02), so waiting forever would yield an empty matrix.
    // Starting anyway turns it into 「does a focused field produce a caret while the
    // window is not foreground?」 — read together with the WinForms control run.
    if (document.hasFocus() || waited > 3000) { setTimeout(step, 500); return; }
    waited += 200;
    setTimeout(waitForFocus, 200);
  })();
})();
</script>
</body>
</html>
