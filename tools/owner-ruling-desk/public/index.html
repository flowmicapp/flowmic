<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FlowMic · 待您拍板</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <p class="brand">FlowMic</p>
        <h1 id="title">待您拍板</h1>
        <p class="lede" id="subtitle"></p>
        <div class="hero-meta">
          <span>本地裁定台 · 仅本机访问</span>
          <span id="latest-hint" class="muted"></span>
        </div>
      </header>

      <nav class="toc" id="toc" aria-label="章节目录"></nav>

      <main id="sections"></main>

      <footer class="submit-bar">
        <div class="submit-inner">
          <label class="field">
            <span>您怎么称呼（可选）</span>
            <input id="submitter" type="text" autocomplete="name" placeholder="例如：owner" />
          </label>
          <label class="field grow">
            <span>给开发侧的总备注（可选）</span>
            <textarea id="global-note" rows="2" placeholder="任何跨章节的补充、红线或先后顺序……"></textarea>
          </label>
          <p class="footnote" id="footnote"></p>
          <div class="actions">
            <button type="button" id="submit-btn" class="primary">提交裁定</button>
            <p id="status" class="status" role="status" aria-live="polite"></p>
          </div>
        </div>
      </footer>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
