<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FlowMic · 同音/成语语料录音（C1）</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <h1>同音 / 成语口播语料</h1>
      <p class="lead">
        点「开始录音」→ 按屏幕稿朗读 →「停止并保存」。文件只写到本机受管目录
        <code>.local/homophone-corpus/</code>（已 gitignore，永不入库）。至少录
        seg-01～seg-03；seg-04/05 可选。
      </p>
      <div class="meta">
        <span>保存目录 <code id="corpus-dir">…</code></span>
        <span>仅监听 127.0.0.1</span>
      </div>
      <div class="seg-nav" id="seg-nav"></div>
      <section class="card">
        <h2 id="seg-title">…</h2>
        <p class="hint" id="seg-hint"></p>
        <pre class="script" id="script"></pre>
        <div class="controls">
          <button type="button" class="primary" id="btn-start">开始录音</button>
          <button type="button" class="danger" id="btn-stop" disabled>停止并保存</button>
          <span class="timer" id="timer">00:00</span>
        </div>
        <p class="status" id="status"></p>
      </section>
      <section class="takes">
        <h3>已保存的 take（最新在上）</h3>
        <ul id="takes-list"></ul>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
